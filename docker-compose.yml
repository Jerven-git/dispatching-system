services:
  frontend:
    image: dispatching-frontend:dev
    build:
      context: ./dispatching-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"      # Main dev server
      - "24678:24678"    # HMR
    volumes:
      - ./dispatching-frontend:/app
    environment:
      HOST: '0.0.0.0'
      NODE_ENV: development
      WATCHPACK_POLLING: true
    networks:
      - app-network

  backend:
    image: dispatching-backend:dev
    build:
      context: ./dispatching-backend
      dockerfile: Dockerfile
      args:
        PHP_ENV: development
    restart: unless-stopped
    volumes:
      - ./dispatching-backend:/var/www/html
    env_file:
      - ./dispatching-backend/.env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./dispatching-backend:/var/www/html
      - ./dispatching-frontend:/app
    ports:
      - 8000:80
    networks:
      - app-network

  db:
    platform: linux/x86_64
    image: mysql:latest
    restart: unless-stopped
    volumes:
      - ./storage/db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network

  phpmyadmin:
    platform: linux/amd64
    image: phpmyadmin:5
    container_name: pma
    depends_on:
      - db
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - 8001:80
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
