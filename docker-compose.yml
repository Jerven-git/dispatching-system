services:
  frontend:
    image: ssu-frontend:dev
    build:
      context: ./ssu-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"      # Main dev server
      - "24678:24678"    # HMR
    volumes:
      - ./ssu-frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      HOST: '0.0.0.0'
      NODE_ENV: development
      WATCHPACK_POLLING: true
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - app-network

  backend:
    image: ssu-backend:dev
    build:
      context: ./ssu-backend
      dockerfile: Dockerfile
      args:
        PHP_ENV: development
    restart: unless-stopped
    volumes:
      - ./ssu-backend:/var/www/html
    env_file:
      - ./ssu-backend/.env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./ssu-backend:/var/www/html
      - ./ssu-frontend:/app
    ports:
      - 8000:80
    networks:
      - app-network

  db:
    platform: linux/x86_64
    image: mysql:latest
    restart: unless-stopped
    volumes:
      - ./storage/db-data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - app-network
  
  phpmyadmin:
        platform: linux/amd64
        image: phpmyadmin:5
        container_name: pma
        depends_on:
            - db
        restart: unless-stopped
        environment:
            PMA_HOST: db
            PMA_PASSWORD: ${DB_ROOT_PASSWORD}
        ports:
            - 8001:80
        networks:
            - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./storage/redis-data:/data
    networks:
      - app-network

  queue:
    image: ssu-backend:dev
    build:
      context: ./ssu-backend
      dockerfile: Dockerfile
      args:
        PHP_ENV: development
    restart: unless-stopped
    volumes:
      - ./ssu-backend:/var/www/html
    env_file:
      - ./ssu-backend/.env
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=90"]
    depends_on:
      - redis
      - db
    networks:
      - app-network

  reverb:
    image: ssu-backend:dev
    build:
      context: ./ssu-backend
      dockerfile: Dockerfile
      args:
        PHP_ENV: development
    restart: unless-stopped
    volumes:
      - ./ssu-backend:/var/www/html
    env_file:
      - ./ssu-backend/.env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      - redis
    networks:
      - app-network

volumes:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
